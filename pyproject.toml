[project]
name = "story-graph"
version = "0.1.0"
description = "Generate character relationship graphs from fictional stories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "docx2txt>=0.9",
    "ebooklib>=0.20",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=1.4.1",
    "langsmith>=0.10.15",
    "networkx>=3.6.1",
    "openai>=2.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.68.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "pyvis>=0.3.2",
    "spacy>=3.8.11",
    "sqlalchemy>=2.0.51",
    "tiktoken>=0.12.0",
    "uvicorn>=0.41.0",
]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = [
    "story_graph",
]
[tool.fastapi]
entrypoint = "story_graph.web.app:app"
