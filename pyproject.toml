[project]
name = "story-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=1.4.1",
    "networkx>=3.6.1",
    "openai>=2.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.68.0",
    "python-dotenv>=1.2.2",
    "pyvis>=0.3.2",
    "spacy>=3.8.11",
    "sqlalchemy>=2.0.51",
    "tiktoken>=0.12.0",
    "uvicorn>=0.41.0",
]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
