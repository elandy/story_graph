services:
  postgres:
    image: postgres:17-alpine
    container_name: story-graph-postgres
    environment:
      POSTGRES_DB: story_graph
      POSTGRES_USER: story_graph
      POSTGRES_PASSWORD: story_graph
    ports:
      - "5432:5432"
    volumes:
      - story_graph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story_graph -d story_graph"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  story-graph:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://story_graph:story_graph@postgres:5432/story_graph
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
    command:
      [
        "uvicorn",
        "story_graph.web.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

volumes:
  story_graph_postgres_data: